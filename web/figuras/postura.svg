<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="Inter, Segoe UI, Arial, sans-serif">
  <!-- Vista como en un espejo: el mástil sube hacia la izquierda de la imagen. -->
  <g fill="#3A3A36">
    <circle cx="320" cy="48" r="30"/>
    <path d="M262 106 C 262 92 282 86 320 86 C 358 86 378 92 378 106 L 372 300 L 268 300 Z"/>
    <path d="M268 286 C 240 290 214 300 208 318 L 208 372 L 244 372 L 250 330 L 300 318 Z"/>
    <path d="M372 286 C 410 300 438 324 442 346 L 446 402 L 410 402 L 402 356 L 340 318 Z"/>
  </g>
  <rect x="186" y="372" width="86" height="14" rx="3" fill="#6E6D68"/>
  <text x="229" y="406" fill="#8F8E89" font-size="12" text-anchor="middle">soporte o banqueta</text>
  <!-- Guitarra -->
  <g transform="rotate(30 330 235)">
    <rect x="36" y="222" width="170" height="26" rx="3" fill="#6B4E2E"/>
    <rect x="2" y="216" width="38" height="38" rx="4" fill="#4E3920"/>
    <path d="M200 235 C 208 188 268 186 286 206 C 300 220 318 220 332 206 C 356 180 436 188 438 235 C 436 282 356 290 332 264 C 318 250 300 250 286 264 C 268 284 208 282 200 235 Z" fill="#B98A52" stroke="#E6C89A" stroke-width="2"/>
    <circle cx="282" cy="235" r="19" fill="#2E2E2B"/>
    <rect x="370" y="222" width="10" height="26" rx="2" fill="#5D4428"/>
    <path d="M40 227 H 376 M40 235 H 376 M40 243 H 376" stroke="#E6E3DC" stroke-width="1" opacity=".55"/>
  </g>
  <!-- Antebrazo derecho, por encima de la guitarra -->
  <path d="M378 110 L 456 200 L 372 262" fill="none" stroke="#55554F" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Los cuatro apoyos -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#1D1D1B">
    <circle cx="282" cy="292" r="13" fill="#3DFF6E"/><text x="282" y="297">1</text>
    <circle cx="408" cy="330" r="13" fill="#3DFF6E"/><text x="408" y="335">2</text>
    <circle cx="288" cy="150" r="13" fill="#3DFF6E"/><text x="288" y="155">3</text>
    <circle cx="420" cy="232" r="13" fill="#3DFF6E"/><text x="420" y="237">4</text>
  </g>
  <g font-size="14" fill="#E6E3DC">
    <text x="478" y="154"><tspan font-weight="700">3</tspan> Pecho</text>
    <text x="478" y="236"><tspan font-weight="700">4</tspan> Antebrazo</text>
    <text x="478" y="254">derecho</text>
    <text x="478" y="334"><tspan font-weight="700">2</tspan> Muslo derecho</text>
    <text x="16" y="296"><tspan font-weight="700">1</tspan> Muslo izquierdo</text>
  </g>
  <path d="M478 148 H 304 M466 232 H 436 M470 330 H 424 M140 292 H 266" stroke="#6E6D68" stroke-width="1"/>
  <text x="16" y="44" fill="#B4B1A8" font-size="13">Clavijero, a la altura</text>
  <text x="16" y="61" fill="#B4B1A8" font-size="13">del hombro</text>
</svg>
